<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BoardMath</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/contrib/auto-render.min.js"></script>
<style>
  body { font-family: sans-serif; margin: 8px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .row img { width: 48%; min-width: 300px; border: 1px solid #888; background: #eee; }
  pre { background: #f4f4f4; padding: 6px; white-space: pre-wrap; }
  #rendered { font-size: 1.4em; border: 1px solid #ccc; padding: 6px; min-height: 2em; }
  #eqs li { margin: 6px 0; cursor: pointer; }
  #eqs li.sel { background: #ffe; }
  #eqs code { color: #555; font-size: .85em; }
</style>
</head>
<body>
<h3>BoardMath</h3>
<div>
  <button id="pause">pause</button>
  <label><input type="checkbox" id="bw"> B&amp;W threshold</label>
  <label><input type="checkbox" id="invert"> invert (blackboard)</label>
  <label>min interval s <input type="number" id="interval" step="0.5" min="0" style="width:4em"></label>
  <label>diff threshold <input type="number" id="diff" step="0.5" min="0" style="width:4em"></label>
</div>
<p id="stats">...</p>
<div class="row">
  <img src="/video" alt="live camera">
  <img id="proc" alt="preprocessed frame sent to OCR">
</div>

<h4>Latest snapshot <span id="snapinfo"></span></h4>
<div id="rendered" aria-live="polite"></div>
<pre id="raw"></pre>

<h4>Lecture equations (newest first)</h4>
<ol id="eqs" reversed></ol>

<script>
const $ = id => document.getElementById(id);
const opts = {
  delimiters: [
    {left: "$$", right: "$$", display: true},
    {left: "\\[", right: "\\]", display: true},
    {left: "\\(", right: "\\)", display: false},
    {left: "$", right: "$", display: false},
  ],
  output: "htmlAndMathml",   // MathML for screen readers
  throwOnError: false,
};
const esc = s => s.replace(/[&<>]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;"}[c]));
const tex = (latex, display) => katex.renderToString(latex, {displayMode: display, output: "htmlAndMathml", throwOnError: false});

let lastSnap = 0, lastEqCount = 0, settingsLoaded = false;

async function post(url, body) {
  const r = await fetch(url, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body || {})});
  return r.json();
}
$("pause").onclick = async () => { const r = await post("/api/pause"); $("pause").textContent = r.paused ? "resume" : "pause"; };
const sendSettings = () => post("/api/settings", {
  bw: $("bw").checked, invert: $("invert").checked,
  interval: $("interval").value, diff_threshold: $("diff").value,
});
["bw", "invert", "interval", "diff"].forEach(id => $(id).onchange = sendSettings);

async function tick() {
  try {
    const s = await (await fetch("/api/state")).json();
    const st = s.stats;
    $("stats").textContent = `backend=${st.backend} | ${st.status} | snapshots=${st.snapshots} | skipped(unchanged)=${st.skipped} | frame diff ${st.last_diff ?? "-"} | last OCR ${st.last_latency ?? "-"}s | cam ${st.cam_fps} fps | transcript: ${st.transcript}`;
    $("proc").src = "/processed.jpg?" + Date.now();
    if (!settingsLoaded) {
      $("bw").checked = s.settings.bw; $("invert").checked = s.settings.invert;
      $("interval").value = s.settings.interval; $("diff").value = s.settings.diff_threshold;
      $("pause").textContent = s.paused ? "resume" : "pause";
      settingsLoaded = true;
    }
    if (s.latest && s.latest.id !== lastSnap) {
      lastSnap = s.latest.id;
      $("snapinfo").textContent = `#${s.latest.id} @ ${s.latest.time} (${s.latest.latency}s)`;
      $("raw").textContent = s.latest.markdown;
      $("rendered").innerHTML = esc(s.latest.markdown).replace(/\n/g, "<br>");
      renderMathInElement($("rendered"), opts);
    }
    if (s.equations.length !== lastEqCount) {
      for (const e of s.equations.slice(lastEqCount)) {
        const li = document.createElement("li");
        li.value = e.n;
        li.innerHTML = `<span>${tex(e.latex, true)}</span><code>${esc(e.latex)}</code> <small>${e.time}</small>`;
        li.onclick = () => {
          document.querySelectorAll("#eqs li.sel").forEach(x => x.classList.remove("sel"));
          li.classList.add("sel");
          $("rendered").innerHTML = tex(e.latex, true);
          $("raw").textContent = e.latex;
          $("snapinfo").textContent = `equation ${e.n} @ ${e.time} (selected; next snapshot replaces this)`;
        };
        $("eqs").prepend(li);
      }
      lastEqCount = s.equations.length;
    }
  } catch (err) {
    $("stats").textContent = "server unreachable: " + err;
  }
}
setInterval(tick, 1000);
tick();
</script>
</body>
</html>
